name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: format + lint + typecheck + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: install workspaces (lockfile-reproducible)
        run: npm ci --no-audit --no-fund
      - name: format + lint (Biome)
        run: npm run biome:check
      - name: typecheck (all packages)
        run: npm run typecheck
      - name: test (workspaces, if-present)
        run: npm test
      - name: audit (production deps, high+)
        # Gate on what actually ships. Dev-only tooling (vitest/vite/esbuild) has
        # advisories that only clear via a breaking vitest major; those never
        # reach production. Runtime deps are audited here and must stay clean.
        run: npm audit --omit=dev --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Use the open-source gitleaks CLI directly. The gitleaks-action wrapper
      # requires a paid GITLEAKS_LICENSE for organizations; the CLI does not and
      # runs the same scan engine.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan for secrets
        run: gitleaks detect --source . --no-git --redact --exit-code 1

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
