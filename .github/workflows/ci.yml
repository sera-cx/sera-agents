name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: format + lint + typecheck + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - name: install workspaces (lockfile-reproducible)
        run: npm ci --no-audit --no-fund
      - name: format + lint (Biome)
        run: npm run biome:check
      - name: typecheck (all packages)
        run: npm run typecheck
      - name: css is in sync with markup
        # assets/tailwind.css is committed (the VM builds the static image from
        # the repo and has no Node), so it can drift when markup adds classes.
        # Rebuild and fail if the result differs from what's checked in.
        run: npm run check:css
      - name: test (workspaces, if-present)
        run: npm test
      - name: audit (production deps, high+)
        # Gate on what actually ships. Dev-only tooling (vitest/vite/esbuild) has
        # advisories that only clear via a breaking vitest major; those never
        # reach production. Runtime deps are audited here and must stay clean.
        run: npm audit --omit=dev --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Use the open-source gitleaks CLI directly. The gitleaks-action wrapper
      # requires a paid GITLEAKS_LICENSE for organizations; the CLI does not and
      # runs the same scan engine.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
          # sha256 of gitleaks_8.21.2_linux_x64.tar.gz, from the release's
          # published checksums.txt. Piping the tarball straight into tar left
          # no opportunity to verify it; download, verify, then extract.
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          sudo tar -xzf "$tarball" -C /usr/local/bin gitleaks
          rm -f "$tarball"
          gitleaks version
      - name: Scan for secrets
        run: gitleaks detect --source . --no-git --redact --exit-code 1

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4
